<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Tracker</title>
    <style>
        :root {
            --bg: #f4f6f8;
            --card: #ffffff;
            --primary: #2563eb;
            --text: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: var(--card);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        /* Balance Banner */
        .balance-card {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
        }

        .balance-label {
            font-size: 0.75rem;
            color: #1e40af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .balance-amount {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1e3a8a;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        button:disabled {
            background: #94a3b8;
        }

        #status {
            margin-top: 12px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Balance Header -->
        <div class="balance-card">
            <div class="balance-label">Current Balance</div>
            <div id="balanceValue" class="balance-amount">Loading...</div>
        </div>

        <form id="trackerForm">
            <div class="form-group">
                <label for="tabName">Target Sheet Tab Name</label>
                <input type="text" id="tabName" value="Jajan💸" required>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="time">Time</label>
                    <input type="time" id="time" required>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="type">Type (In/Out)</label>
                    <select id="type">
                        <option value="OUT">OUT (Expense)</option>
                        <option value="IN">IN (Income)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="Grocery">Grocery</option>
                        <option value="Eating Outside">Eating Outside</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="text" id="amount" inputmode="numeric" placeholder="0" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" rows="2" placeholder="Detail..."></textarea>
            </div>

            <button type="submit" id="submitBtn">Submit Transaction</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbypyFpR8FiTak6RFSFvBab4CjkNSb--tqIrP4a7KpEjsmrBIjrklFwYrutLgFVJ6iveBQ/exec";
        const BALANCE_CELL = "N8"; // Target cell N8

        // Set default values on page load
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('tabName').value = "Jajan💸";

            const now = new Date();
            document.getElementById('date').value = now.toISOString().split('T')[0];
            document.getElementById('time').value = now.toTimeString().slice(0, 5);

            fetchBalance();
        });

        // Formatting input number with thousand separators
        const amountInput = document.getElementById('amount');
        amountInput.addEventListener('input', (e) => {
            let rawValue = e.target.value.replace(/\D/g, '');
            e.target.value = rawValue ? new Intl.NumberFormat('id-ID').format(rawValue) : '';
        });

        // Fetch Balance from Google Sheet
        async function fetchBalance() {
            const tabName = document.getElementById('tabName').value.trim();
            const balanceEl = document.getElementById('balanceValue');
            if (!tabName) return;

            balanceEl.textContent = 'Loading...';

            try {
                const url = `${SCRIPT_URL}?tabName=${encodeURIComponent(tabName)}&cell=${BALANCE_CELL}`;
                const response = await fetch(url);

                const responseText = await response.text();
                let data;

                try {
                    data = JSON.parse(responseText);
                } catch (jsonErr) {
                    console.error("Non-JSON response received (Deployment version issue):", responseText);
                    balanceEl.textContent = 'Deploy Error';
                    return;
                }

                if (data.status === 'success') {
                    balanceEl.textContent = data.balance || 'Rp 0';
                } else {
                    console.error('Apps Script Error:', data.message, 'Found tabs:', data.availableTabs);
                    balanceEl.textContent = 'Tab Not Found';
                }
            } catch (err) {
                console.error('Network Error:', err);
                balanceEl.textContent = 'Conn Error';
            }
        }

        // Refetch when tab name input changes
        document.getElementById('tabName').addEventListener('change', fetchBalance);

        // Form Submit Handler
        let isSubmitting = false;
        document.getElementById('trackerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isSubmitting) return;
            isSubmitting = true;

            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('submitBtn');

            statusDiv.style.color = '#2563eb';
            statusDiv.textContent = 'Sending...';
            btn.disabled = true;

            const rawAmount = document.getElementById('amount').value.replace(/\D/g, '');

            const payload = {
                tabName: document.getElementById('tabName').value.trim(),
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                type: document.getElementById('type').value,
                category: document.getElementById('category').value,
                amount: rawAmount,
                description: document.getElementById('description').value
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'text/plain;charset=utf-8'},
                    body: JSON.stringify(payload)
                });

                statusDiv.style.color = '#16a34a';
                statusDiv.textContent = 'Transaction saved!';
                document.getElementById('amount').value = '';
                document.getElementById('description').value = '';

                // Auto-refresh balance 1.5s after submission
                setTimeout(fetchBalance, 1500);

            } catch (err) {
                statusDiv.style.color = '#dc2626';
                statusDiv.textContent = 'Failed to submit';
                console.error(err);
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    isSubmitting = false;
                }, 1500);
            }
        });
    </script>

</body>

</html>
